<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#262523" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ChromePad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="brand-name">ChromePad</span></div>

    <div id="status" class="status reconnecting">
      <span class="dot"></span><span id="status-text">connecting</span>
    </div>

    <div class="tools">
      <button id="kb-toggle" class="icon-btn" aria-label="Keyboard">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="6" width="19" height="12" rx="2.2" />
          <path d="M6 9.5h0M9 9.5h0M12 9.5h0M15 9.5h0M18 9.5h0M6 12.5h0M9 12.5h0M12 12.5h0M15 12.5h0M18 12.5h0M8.5 15.5h7"
                stroke-linecap="round" />
        </svg>
      </button>
      <button id="clip-toggle" class="icon-btn" aria-label="Send to PC">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20.5 21 12 4 3.5l2.2 7.2 8.6 1.3-8.6 1.3z" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="settings-toggle" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" />
          <path d="M12 3.5v2.2M12 18.3v2.2M4.5 12H2.3M21.7 12h-2.2M6.4 6.4 4.9 4.9M19.1 19.1l-1.5-1.5M17.6 6.4l1.5-1.5M4.9 19.1l1.5-1.5"
                stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <main id="pad">
    <p id="hint" class="hint">
      Put a finger down to move the cursor. Tap: click · two fingers: right-click
      · double-tap and hold: drag.
    </p>

    <div id="joystick" class="joystick hidden">
      <div class="joy-base"></div>
      <div class="joy-stick"></div>
    </div>
  </main>

  <aside id="volume" class="volume" aria-label="Volume">
    <button id="mute-btn" class="vol-mute" aria-label="Mute">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M4 9h3l4.5-3.2v12.4L7 15H4z" />
        <path class="wave" d="M15.3 9a4 4 0 0 1 0 6M17.8 7a7 7 0 0 1 0 10" stroke-linecap="round" />
        <path class="slash" d="M4 4l16 16" stroke-linecap="round" />
      </svg>
    </button>
    <div id="vol-track" class="scroll-track"><div class="scroll-grip"></div></div>
    <span class="scroll-label">Volume</span>
  </aside>

  <aside id="scroll" class="scroll" aria-label="Scroll wheel">
    <div class="scroll-track"><div class="scroll-grip"></div></div>
    <span class="scroll-label">Scroll</span>
  </aside>

  <button id="kb-pill" class="kb-pill hidden">Open keyboard</button>

  <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label for="sensitivity">Cursor sensitivity</label>
    <input type="range" id="sensitivity" min="0.3" max="3" step="0.05" value="1" />
    <div class="sens-value"><span id="sens-value">1.00</span><span class="times">×</span></div>

    <label class="seg-label">Pointer mode</label>
    <div class="seg" id="mode-seg">
      <button type="button" class="seg-btn" data-mode="joystick">Joystick</button>
      <button type="button" class="seg-btn" data-mode="trackpad">Trackpad</button>
    </div>

    <button id="settings-close" class="btn-primary">Close</button>
  </div>

  <div id="clip-panel" class="settings-panel clip-panel hidden" role="dialog" aria-label="Send to PC">
    <h2>Send to PC</h2>
    <label for="clip-text">Text or link to put on the PC clipboard</label>
    <textarea id="clip-text" class="clip-text" rows="3" placeholder="Paste or type here…"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="clip-actions">
      <button id="clip-send" class="btn-primary">Copy to PC</button>
      <button id="clip-paste" class="btn-ghost">Copy &amp; paste</button>
    </div>
    <button id="clip-close" class="btn-ghost btn-close">Close</button>
  </div>

  <!-- hidden field: gets focus to raise the native keyboard -->
  <textarea id="hidden-input" class="hidden-input" rows="1"
            autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" aria-hidden="true"></textarea>

  <script src="app.js"></script>
</body>
</html>
